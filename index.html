<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="main-menu" class="screen active">
        <div class="menu-background"></div>
        <div class="menu-content">
            <div class="language-selector">
                <select id="language-select">
                    <!-- Populated dynamically by i18n.js -->
                </select>
            </div>
            <button id="menu-settings-btn" class="icon-btn menu-settings-btn" title="Switch access settings">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
            <div id="menu-settings-panel" class="settings-panel menu-settings-panel hidden">
                <!-- Scan mode: off / step scan (2-switch) / auto scan (1-switch) -->
                <div class="setting-row scan-mode-row">
                    <label class="scan-mode-option" title="Scanning off">
                        <input type="radio" name="scan-mode" value="off">
                        <span class="scan-mode-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="8"/>
                                <line x1="6.5" y1="17.5" x2="17.5" y2="6.5"/>
                            </svg>
                        </span>
                    </label>
                    <label class="scan-mode-option" title="Step scan: right switch = move, left switch = choose">
                        <input type="radio" name="scan-mode" value="step" checked>
                        <span class="scan-mode-btn">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="8" cy="12" r="5"/>
                                <circle cx="18" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </span>
                    </label>
                    <label class="scan-mode-option" title="Auto scan: highlight moves by itself, press to choose">
                        <input type="radio" name="scan-mode" value="auto">
                        <span class="scan-mode-btn">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="10" cy="12" r="5"/>
                                <path d="M17 8a5.5 5.5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M19.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </label>
                </div>
                <!-- Auto scan speed -->
                <div class="setting-row" title="Auto scan speed">
                    <svg class="setting-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.6l-4.5 2.6a.5.5 0 0 1-.5-.87L12 12V6.5a.5.5 0 0 1 1 0z"/>
                    </svg>
                    <input type="range" id="scan-speed-slider" min="500" max="4000" step="250" value="1500">
                </div>
                <!-- Debounce (ignore rapid repeat presses) -->
                <div class="setting-row" title="Ignore repeated presses (tremor filter)">
                    <svg class="setting-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h4l2-7 4 14 2-7h6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="range" id="debounce-slider" min="0" max="1000" step="100" value="0">
                </div>
                <!-- Practice mode: games never end -->
                <div class="setting-row" title="Practice mode: games never end">
                    <label class="practice-toggle">
                        <input type="checkbox" id="practice-toggle">
                        <span class="practice-icon">∞</span>
                    </label>
                </div>
            </div>
            <h1 class="game-title" data-i18n="title">SWITCH GAMES</h1>
            <div class="menu-nav">
                <button id="prev-page-btn" class="nav-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <div class="page-container">
                    <div class="button-grid" id="games-grid"></div>
                </div>
                <button id="next-page-btn" class="nav-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>
            <div class="page-indicator" id="page-indicator"></div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <button id="home-btn" class="icon-btn home-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </button>
            <div class="game-info">
                <span id="score-display"><span data-i18n="score">SCORE</span>: 0</span>
                <span id="level-display"><span data-i18n="level">LEVEL</span>: 1</span>
                <span id="practice-badge" class="practice-badge hidden" title="Practice mode">∞</span>
            </div>
            <button id="settings-btn" class="icon-btn settings-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="setting-row">
                <svg class="setting-icon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="10,8 16,12 10,16"/>
                </svg>
                <input type="range" id="speed-slider" min="1" max="10" value="5">
                <svg class="setting-icon fast" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="4,8 10,12 4,16"/>
                    <polygon points="12,8 18,12 12,16"/>
                </svg>
            </div>
            <div class="setting-row">
                <label class="sound-toggle">
                    <input type="checkbox" id="sound-toggle" checked>
                    <span class="sound-icon on">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </span>
                    <span class="sound-icon off">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </span>
                </label>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>

        <div class="game-controls">
            <button id="left-btn" class="control-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button id="right-btn" class="control-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="overlay hidden">
        <div class="overlay-content">
            <h2 data-i18n="gameOver">GAME OVER</h2>
            <p id="new-record" class="new-record hidden">🎉 NEW RECORD! 🎉</p>
            <p id="encouragement" class="encouragement"></p>
            <p><span data-i18n="score">SCORE</span>: <span id="final-score">0</span></p>
            <p class="best-score-line">🏆 <span id="best-score">0</span></p>
            <button id="restart-btn" class="menu-btn"><span class="key-hint">⬅</span> <span data-i18n="playAgain">PLAY AGAIN</span></button>
            <button id="menu-btn" class="menu-btn"><span data-i18n="mainMenu">MAIN MENU</span> <span class="key-hint">➡</span></button>
        </div>
    </div>

    <!-- Instructions Overlay -->
    <div id="instructions" class="overlay hidden">
        <div class="overlay-content instructions-content">
            <!-- Header Row with Close and Settings buttons -->
            <div class="instructions-header">
                <button id="instructions-close-btn" class="instructions-close-btn" title="Close">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
                <button id="instructions-settings-btn" class="instructions-settings-btn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </button>
            </div>
            
            <h2 id="instructions-title" data-i18n="howToPlay">HOW TO PLAY</h2>
            
            <!-- Instructions Text -->
            <p id="instructions-text"></p>
            
            <!-- Settings Panel (hidden by default) - Icons Only -->
            <div id="instructions-settings-panel" class="instructions-settings-panel hidden">
                <!-- Switch Mode - Icon Only -->
                <div class="setting-section-icon">
                    <div class="switch-mode-options-icon">
                        <label class="switch-mode-option-icon" title="2 Switch">
                            <input type="radio" name="switch-mode" value="2" checked>
                            <span class="switch-mode-btn-icon two-switch">
                                <svg viewBox="0 0 24 24" class="circle-left">
                                    <circle cx="12" cy="12" r="8"/>
                                </svg>
                                <svg viewBox="0 0 24 24" class="circle-right">
                                    <circle cx="12" cy="12" r="8"/>
                                </svg>
                            </span>
                        </label>
                        <label class="switch-mode-option-icon" title="1 Switch">
                            <input type="radio" name="switch-mode" value="1">
                            <span class="switch-mode-btn-icon single">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="12" r="8"/>
                                </svg>
                            </span>
                        </label>
                    </div>
                </div>
                
                <!-- Speed - Icons Only -->
                <div class="setting-section-icon">
                    <div class="setting-row-icon">
                        <svg class="setting-icon-speed" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15 2c-2.71 0-5.05 1.54-6.22 3.78a7.062 7.062 0 0 0-3 3A7.014 7.014 0 0 0 2 15c0 3.87 3.13 7 7 7 2.71 0 5.05-1.54 6.22-3.78a7.062 7.062 0 0 0 3-3A7.014 7.014 0 0 0 22 9c0-3.87-3.13-7-7-7zM9 20c-2.76 0-5-2.24-5-5 0-1.12.37-2.16 1-3 0 3.87 3.13 7 7 7-.84.63-1.88 1-3 1zm3-3c-2.76 0-5-2.24-5-5 0-1.12.37-2.16 1-3 0 3.86 3.13 6.99 7 7-.84.63-1.88 1-3 1zm4.7-3.3a5.001 5.001 0 0 0-6.4-6.4 5.001 5.001 0 0 1 6.4 6.4z"/>
                        </svg>
                        <input type="range" id="instructions-speed-slider" min="1" max="10" value="5">
                        <svg class="setting-icon-speed fast" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15 2c-2.71 0-5.05 1.54-6.22 3.78a7.062 7.062 0 0 0-3 3A7.014 7.014 0 0 0 2 15c0 3.87 3.13 7 7 7 2.71 0 5.05-1.54 6.22-3.78a7.062 7.062 0 0 0 3-3A7.014 7.014 0 0 0 22 9c0-3.87-3.13-7-7-7zM9 20c-2.76 0-5-2.24-5-5 0-1.12.37-2.16 1-3 0 3.87 3.13 7 7 7-.84.63-1.88 1-3 1zm3-3c-2.76 0-5-2.24-5-5 0-1.12.37-2.16 1-3 0 3.86 3.13 6.99 7 7-.84.63-1.88 1-3 1zm4.7-3.3a5.001 5.001 0 0 0-6.4-6.4 5.001 5.001 0 0 1 6.4 6.4z"/>
                            <path d="M20 4l-2 2m2-2l-2-2m2 2h-3" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </div>
                
                <!-- Sound - Icon Only -->
                <div class="setting-section-icon">
                    <div class="setting-row-icon">
                        <label class="sound-toggle-icon">
                            <input type="checkbox" id="instructions-sound-toggle" checked>
                            <span class="sound-icon-btn on">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                            </span>
                            <span class="sound-icon-btn off">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                                </svg>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
            
            <button id="start-game-btn" class="menu-btn"><span class="key-hint">⬅</span><span class="key-hint">➡</span> <span data-i18n="startGame">START GAME</span></button>
        </div>
    </div>

</body>
