<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a1a">
    <title>Switch Games</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="main-menu" class="screen active">
        <div class="menu-background" aria-hidden="true"></div>
        <div class="menu-content">
            <header class="menu-heading">
                <h1 class="game-title" data-i18n="title">SWITCH GAMES</h1>
                <button id="menu-settings-btn" data-ui="settings">Settings</button>
            </header>
            <p id="menu-help" class="help"></p>
            <div class="menu-nav">
                <button id="prev-page-btn" class="nav-btn" data-ui="previous">Previous</button>
                <div class="page-container"><div class="button-grid" id="games-grid"></div></div>
                <button id="next-page-btn" class="nav-btn" data-ui="next">Next</button>
            </div>
            <p class="page-indicator" id="page-indicator" aria-live="polite"></p>
        </div>
    </main>
    <section id="game-screen" class="screen">
        <header class="game-header">
            <button id="home-btn" data-i18n="mainMenu">Main menu</button>
            <div class="game-info">
                <span><span data-i18n="score">Score</span>: <span id="score-value">0</span></span>
                <span><span data-i18n="level">Level</span>: <span id="level-value">1</span></span>
                <span id="practice-badge" hidden>∞</span>
            </div>
            <button id="pause-btn" data-ui="pause">Pause</button>
            <button id="settings-btn" data-ui="settings">Settings</button>
        </header>
        <div id="play-area">
            <canvas id="game-canvas" width="600" height="600" tabindex="0" role="img" aria-describedby="canvas-description game-status"></canvas>
        </div>
        <p id="canvas-description" class="sr-only"></p>
        <p id="game-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
        <p id="game-cue" class="game-cue" aria-hidden="true"></p>
        <div class="game-controls">
            <button id="left-btn" class="control-btn" data-ui="left">Left</button>
            <p id="hold-help" class="help"></p>
            <button id="right-btn" class="control-btn" data-ui="right">Right</button>
        </div>
    </section>
    <section id="instructions" class="overlay" role="dialog" aria-modal="true" aria-labelledby="instructions-title" hidden>
        <div class="overlay-content instructions-content">
            <h2 id="instructions-title"></h2><p id="instructions-text"></p>
            <button id="start-game-btn" class="menu-btn" data-i18n="startGame">Start game</button>
            <button id="game-mode-btn" class="menu-btn"></button>
            <div class="speed-controls">
                <button id="slower-btn" data-ui="slower">Slower</button>
                <output id="game-speed-value" aria-live="polite"></output>
                <button id="faster-btn" data-ui="faster">Faster</button>
            </div>
            <button id="instructions-close-btn" class="menu-btn" data-ui="back">Back</button>
        </div>
    </section>
    <section id="pause-dialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
        <div class="overlay-content">
            <h2 id="pause-title" data-ui="paused">Paused</h2>
            <button id="resume-btn" class="menu-btn" data-ui="resume">Resume</button>
            <button id="pause-settings-btn" class="menu-btn" data-ui="settings">Settings</button>
            <button id="pause-menu-btn" class="menu-btn" data-i18n="mainMenu">Main menu</button>
        </div>
    </section>
    <section id="game-over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
        <div class="overlay-content">
            <h2 id="game-over-title" data-i18n="gameOver">Game over</h2>
            <p id="new-record" class="new-record" hidden></p><p id="encouragement" class="encouragement"></p>
            <p><span data-i18n="score">Score</span>: <span id="final-score">0</span></p>
            <p>🏆 <span id="best-score">0</span></p>
            <button id="restart-btn" class="menu-btn" data-i18n="playAgain">Play again</button>
            <button id="menu-btn" class="menu-btn" data-i18n="mainMenu">Main menu</button>
        </div>
    </section>
    <section id="settings-dialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <div class="overlay-content settings-content">
            <h2 id="settings-title" data-ui="settings">Settings</h2>
            <p data-ui="settingsHelp">Press a setting to change it.</p>
            <div class="settings-buttons">
                <button id="profile-btn"></button><button id="scan-mode-btn"></button>
                <button id="scan-speed-btn"></button><button id="debounce-btn"></button>
                <button id="hold-btn"></button><button id="practice-btn"></button>
                <button id="sound-btn"></button><button id="speech-btn"></button>
                <button id="text-btn"></button><button id="motion-btn"></button>
                <button id="language-btn" data-ui="language">Language</button>
            </div>
            <button id="settings-close-btn" class="menu-btn" data-ui="back">Back</button>
        </div>
    </section>
    <section id="language-dialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="language-title" hidden>
        <div class="overlay-content settings-content">
            <h2 id="language-title" data-ui="language">Language</h2>
            <button id="language-back-btn" class="menu-btn" data-ui="back">Back</button>
            <div id="language-options" class="settings-buttons"></div>
        </div>
    </section>
    <div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript>This game collection requires JavaScript.</noscript>
    <script src="app.js"></script>
</body>
</html>
